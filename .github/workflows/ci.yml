name: MaliCompat CI / Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b

      - name: Set up CMake & Ninja
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Configure CMake (Android ARM64)
        run: |
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build MaliCompat Core, Probe & Tests
        run: |
          cmake --build build-android --config Release -j$(nproc)

      - name: Package Driver Bundle
        run: |
          mkdir -p build-android/bundle/payload
          cp build-android/libmalicompat.so build-android/bundle/payload/
          cp build-android/libmalicompat.so build-android/bundle/
          cat << 'EOF' > build-android/bundle/driver.json
          {"name":"MaliCompat-G71","libraryName":"libmalicompat.so","folder":"payload"}
          EOF
          cat << 'EOF' > build-android/bundle/meta.json
          {
            "schemaVersion": 1,
            "name": "MaliCompat (Mali-G71)",
            "description": "Vulkan translation shim for Mali Bifrost",
            "author": "CodeAbhi826",
            "packageVersion": "1",
            "vendor": "MaliCompat",
            "driverVersion": "1.0",
            "minApi": 28,
            "libraryName": "libmalicompat.so"
          }
          EOF
          echo -n "libmalicompat.so" > build-android/bundle/.libreria
          cp build-android/bundle/meta.json build-android/bundle/payload/meta.json
          cd build-android/bundle && zip -r ../malicompat-g71.zip . && cd ../..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: malicompat-arm64
          path: |
            build-android/*.so
            build-android/*.zip
            build-android/bin/*
          if-no-files-found: error
